[project]
name = "procurement-ai-assistant"
version = "0.1.0"
description = "Enterprise-grade Event-Driven AI Procurement Assistant built with Clean Architecture, Custom Agent Framework, FastAPI, PostgreSQL pgvector, and Redis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.4",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "litellm>=1.48.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pyjwt[crypto]>=2.9.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "langfuse>=2.50.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008", "E501", "N802", "UP042"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"
